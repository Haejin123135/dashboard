<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { font-family: sans-serif; background:#f4f6f9; margin:0; padding:20px; }
  h1 { margin-top:0; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; }
  .card { background:#fff; border-radius:12px; padding:20px; box-shadow:0 2px 6px rgba(0,0,0,.08); }
  .card .num { font-size:28px; font-weight:bold; margin-top:8px; }
  .chart { background:#fff; border-radius:12px; padding:20px; margin-top:16px; }
</style>
</head>
<body>
  <h1>📊 내 대시보드</h1>
  <div class="cards">
    <div class="card">이번 달 매출<div class="num">1,250만원</div></div>
    <div class="card">방문자 수<div class="num">3,420명</div></div>
    <div class="card">주문 건수<div class="num">186건</div></div>
  </div>
  <div class="chart"><canvas id="myChart"></canvas></div>
  <script>
    new Chart(document.getElementById('myChart'), {
      type: 'bar',
      data: {
        labels: ['1월','2월','3월','4월','5월','6월'],
        datasets: [{ label: '월별 매출(만원)', data: [800, 950, 1100, 900, 1300, 1250] }]
      }
    });
  </script>
</body>
</html>
